name: CI Java

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'implementations/java/**'
      - '.github/workflows/ci-java.yml'
      - 'e2e/**'

jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mkdir -p out
      - run: javac -d out src/main/java/io/rcl/*.java src/test/java/io/rcl/RCLTest.java
      - run: java -cp out io.rcl.RCLTest
