name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  line-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce max 200 lines per source/test file
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 200 ]; then
              echo "File exceeds 200 lines: $f ($lines)"
              bad=1
            fi
          done < <(find . -type f \
            \( -name '*.cr' -o -name '*.ts' -o -name '*.go' -o -name '*.kt' -o -name '*.swift' -o -name '*.rs' -o -name '*.rb' -o -name '*.yml' -o -name '*.yaml' -o -name '*.toml' -o -name '*.hcl' -o -name '*.rcl' \) \
            ! -path './.git/*' \
            ! -path './.github/workflows/*')
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets

  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B -ntp test

  swift:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  crystal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/crystal
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - run: crystal spec
