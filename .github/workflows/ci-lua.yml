name: CI Lua

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'implementations/lua/**'
      - '.github/workflows/ci-lua.yml'
      - 'e2e/**'

jobs:
  lua:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/lua
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - run: lua test.lua
