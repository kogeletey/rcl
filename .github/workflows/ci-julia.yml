name: CI Julia

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'implementations/julia/**'
      - '.github/workflows/ci-julia.yml'
      - 'e2e/**'

jobs:
  julia:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/julia
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - run: julia test/runtests.jl
