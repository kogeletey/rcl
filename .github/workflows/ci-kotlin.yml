name: CI Kotlin

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B -ntp test
