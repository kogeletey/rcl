name: CI Kotlin

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'implementations/kotlin/**'
      - '.github/workflows/ci-kotlin.yml'
      - 'e2e/**'

jobs:
  kotlin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B -ntp test
