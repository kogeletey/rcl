name: CI Kotlin

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'implementations/kotlin/**'
      - '.github/workflows/ci-kotlin.yml'
      - 'e2e/**'

jobs:
  kotlin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Kotlin sources exist
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d src/main/kotlin ] || ! find src/main/kotlin -type f -name '*.kt' | grep -q .; then
            echo "No Kotlin sources found in src/main/kotlin"
            exit 1
          fi
          if [ ! -d src/test/kotlin ] || ! find src/test/kotlin -type f -name '*.kt' | grep -q .; then
            echo "No Kotlin tests found in src/test/kotlin"
            exit 1
          fi
      - run: mvn -B -ntp test
