name: Publish Packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
      - run: npm install
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: mvn -B -ntp test
      - run: mvn -B -ntp deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-assets:
    runs-on: ubuntu-latest
    needs: [publish-typescript, publish-kotlin]
    steps:
      - uses: actions/checkout@v4
      - name: Pack Go, Rust, Swift sources
        run: |
          tar -czf rcl-go.tar.gz -C packages go
          tar -czf rcl-rust.tar.gz -C packages rust
          tar -czf rcl-swift.tar.gz -C packages swift
      - uses: actions/upload-artifact@v4
        with:
          name: language-package-sources
          path: |
            rcl-go.tar.gz
            rcl-rust.tar.gz
            rcl-swift.tar.gz
      - name: Attach assets to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rcl-go.tar.gz
            rcl-rust.tar.gz
            rcl-swift.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
