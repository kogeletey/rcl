name: CI PHP

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'implementations/php/**'
      - '.github/workflows/ci-php.yml'
      - 'e2e/**'

jobs:
  php:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: php test/test.php
