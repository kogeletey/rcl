name: CI PHP

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: php test/test.php
