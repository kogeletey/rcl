name: CI Rust

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'implementations/rust/**'
      - '.github/workflows/ci-rust.yml'
      - 'e2e/**'

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
