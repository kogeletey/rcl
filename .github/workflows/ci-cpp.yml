name: CI C++

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/cpp
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -O2 rcl.cpp rcl_ast.cpp rcl_lexer.cpp rcl_parser.cpp rcl_project.cpp rcl_format.cpp rcl_convert.cpp test.cpp -o test_bin
      - run: ./test_bin
