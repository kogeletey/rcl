name: CI D

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - 'implementations/d/**'
      - '.github/workflows/ci-d.yml'
      - 'e2e/**'

jobs:
  d:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/d
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - if: runner.os != 'Windows'
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - if: runner.os == 'Windows'
        run: dmd -i -Isource source/rcl/package.d test/test.d -oftest_bin.exe
      - if: runner.os != 'Windows'
        run: ldc2 -i -Isource source/rcl/package.d test/test.d -of=test_bin
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path .\test_bin.exe)) {
            Write-Host "test_bin.exe not found in implementations/d"
            Get-ChildItem -Force
            exit 1
          }
          .\test_bin.exe
      - if: runner.os != 'Windows'
        run: ./test_bin
