name: CI D

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  d:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementations/d
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - if: runner.os == 'Windows'
        run: ldc2 -i -Isource source/rcl/package.d test/test.d -of=test_bin.exe
      - if: runner.os != 'Windows'
        run: ldc2 -i -Isource source/rcl/package.d test/test.d -of=test_bin
      - if: runner.os == 'Windows'
        run: .\\test_bin.exe
      - if: runner.os != 'Windows'
        run: ./test_bin
